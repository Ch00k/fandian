[project]
name = "fandian"
version = "0.0.1"
description = "Runs an autonomous black-box exploratory tester (Claude Code in Docker) against a fresh instance of one of my projects."
requires-python = ">=3.14"
dependencies = []

[project.scripts]
fand = "fandian.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fandian"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]
